<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .con{
            height: 600px;
            border: 2px solid black;
        }
        .header, .footer{
            height: 20%;
            width: 100%;
            background-color:teal ;
        }
        .center{
            height: 60%;
            background-color: yellow;
            display: flex;
        }
        .left{
            height: 100%;
            width: 30%;
            background-color: chocolate;
        }
        .right{
            height: 100%;
            width: 70%;
            background-color: cyan;
        }
        .top{
            height: 50%;
            background-color:cornflowerblue;
        }
        .bottom{
            height: 50%;
            background-color: blueviolet;
            display: flex;
        }
        .bottom1{
            height: 100%;
            width: 50%;
            background-color: blue;
        }
        .bottom2{
            height: 100%;
            width: 50%;
            background-color:khaki;
        }
    </style>
</head>
<body>
    <h1 align="center">Flex Box</h1>
    <div class="con">
        <div class="header"></div>
        <div class="center">
            <div class="left"></div>
            <div class="right">
                <div class="top"></div>
                <div class="bottom">
                    <div class="bottom1"></div>
                    <div class="bottom2"></div>
                </div>
            </div>
        </div>
        <div class="footer"></div>
        
    </div>
</body>
</html>
